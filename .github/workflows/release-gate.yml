name: Release gate

# The gate runs on every push and pull request. It is the only thing standing
# between a change and a published financial figure, so it runs the whole suite
# rather than a fast subset.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint, typecheck, test, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Verify host configuration is in sync
        run: npm run host:check

      - name: Tax data audit
        run: npm run tax:audit

      - name: Build
        run: npm run build

      - name: Verify no page is indexable without passing the gate
        run: npx tsx scripts/check-indexability.ts

      - name: Check internal links
        run: npx tsx scripts/check-links.ts

      - name: Upload page inventory
        uses: actions/upload-artifact@v4
        with:
          name: page-manifest
          path: src/data/page-manifests/generated/page-manifest.json

  e2e:
    name: End-to-end, accessibility and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
